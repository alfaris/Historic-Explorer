<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

         in the fallback font meanwhile (display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" /></noscript>
    <meta name="theme-color" content="#f8f7f4" />
    <title>Cairo Historic Explorer</title>
  </head>
  <body class="bg-[#f8f7f4] text-stone-900 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>

  </body>
</html>
