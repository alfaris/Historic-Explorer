name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size
        run: npm run check:bundle

  # The visitor logic and the golden vectors (contracts/vectors) don't depend on
  # the phone's time zone: tourists' phones often keep their home one (#249).
  timezones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz: [Africa/Cairo, UTC, America/Los_Angeles, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests in ${{ matrix.tz }}
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # The native apps' prayer times must match the web's to the minute (#254):
  # adhan2 (Kotlin) against the vectors the web exports in contracts/vectors.
  mobile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Prayer times match the web
        run: gradle -p mobile/spikes/adhan-parity test --console=plain
