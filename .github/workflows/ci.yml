name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size
        run: npm run check:bundle

  # The visitor logic and the golden vectors (contracts/vectors) don't depend on
  # the phone's time zone: tourists' phones often keep their home one (#249).
  timezones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # UTC is the check job's own run.
        tz: [Africa/Cairo, America/Los_Angeles, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests in ${{ matrix.tz }}
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # The apps' shared Kotlin (mobile/): content models, the rules ported from the
  # web (checked against contracts/vectors, prayer times included) and the content
  # client, then the Android app's debug build (#253). Runners have the Android SDK.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (JVM and Android unit tests)
        run: ./gradlew check --console=plain
      - name: Android debug build
        run: ./gradlew :androidApp:assembleCairoDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cairo-walks-debug-apk
          path: mobile/androidApp/build/outputs/apk/cairo/debug/*.apk
          retention-days: 14
